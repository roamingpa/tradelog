{% extends "base.html" %}
{% block title %}Iniciar sesión — Tradelog{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card mt-4">
      <div class="card-header fw-semibold text-center">
        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
      </div>
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            {{ form.password }}
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center small">
        ¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
