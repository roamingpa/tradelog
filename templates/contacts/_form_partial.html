<form hx-post="{% url 'contact-new' %}?select={{ select_id }}"
      hx-target="#dynamicModalBody"
      hx-swap="innerHTML">
  {% csrf_token %}
  <input type="hidden" name="select_id" value="{{ select_id }}">
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
      {% endif %}
    </div>
  {% endfor %}
  <div class="d-grid">
    <button type="submit" class="btn btn-primary">Crear contacto</button>
  </div>
</form>
